services:
  app:
    image: 'kteeraphatt/sitepow-store:latest'
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    ports:
      - '3000:3000'
    depends_on:
      - redis
    networks:
      - webnet

  redis:
    image: redis:alpine
    restart: always
    command:
      [
        'redis-server',
        '--requirepass',
        'sitepow_store_rMYbQ6gAC0EH',
        '--maxmemory',
        '512mb',
        '--maxmemory-policy',
        'allkeys-lru',
        '--appendonly',
        'yes',
      ]
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - webnet

networks:
  webnet:
    external: true
volumes:
  redis_data:
