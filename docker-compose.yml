services:
  app:
    image: 'kteeraphatt/sitepow-store:latest'
    restart: always
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      - redis
    networks:
      - webnet

  redis:
    image: redis:alpine
    restart: always
    command:
      [
        'redis-server',
        '--requirepass',
        'your_strong_password',
        '--maxmemory',
        '512mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    ports:
      - '6379:6379'
    networks:
      - webnet

networks:
  webnet:
    external: true
