services:
  app:
    build: .
    restart: always
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      - db
    networks:
      - webnet

  db:
    image: postgres:16-alpine
    restart: always
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=sitepow
      - POSTGRES_PASSWORD=sitepow
      - POSTGRES_DB=sitepow
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - webnet

volumes:
  pg_data:
networks:
  webnet:
    external: true
